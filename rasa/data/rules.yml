version: "3.1"

rules:
  - rule: Molly Selamlama
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Veda
    steps:
      - intent: goodbye
      - action: utter_goodbye
  
  - rule: Kapsam Dışı Soru
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: SSS Sorgulama
    steps:
      - intent: sss_sor
      - action: action_search_faq

  - rule: Oda Tipleri Sorgulama
    steps:
      - intent: oda_tipi_sor
      - action: action_get_room_types


  - rule: Etkinlik Sorgulama
    steps:
      - intent: etkinlik_sor
      - action: action_etkinlik_sorgula

  - rule: Aktivite Sorgulama
    steps:
      - intent: aktivite_sor
      - action: action_etkinlik_sorgula

  - rule: Fiyat Form Başlat
    steps:
      - intent: fiyat_sorgula
      - action: fiyat_form
      - active_loop: fiyat_form

  - rule: Fiyat Form Tamamla
    condition:
      - active_loop: fiyat_form
    steps:
      - action: fiyat_form
      - active_loop: null
      - action: action_quick_price_check

  - rule: SPA Sorguları
    steps:
      - intent: spa_sor
      - action: action_get_spa_bilgileri

  - rule: Aktivite Detay Sorguları
    steps:
      - intent: aktivite_detay_sor
      - action: action_get_aktivite_bilgileri

  - rule: Yemek Sorguları
    steps:
      - intent: yemek_sor
      - action: action_get_yemek_bilgileri

  - rule: AES Sorguları
    steps:
      - intent: aes_sor
      - action: action_get_aes_bilgileri

  - rule: Devre Mülk Sorguları
    steps:
      - intent: devremulk_sor
      - action: utter_devremulk_tanitim

  - rule: Kurumsal Sorguları
    steps:
      - intent: kurumsal_sor
      - action: utter_kurumsal_tanitim

  - rule: Rezervasyon İsteği
    steps:
      - intent: rezervasyon_yap
      - action: utter_checking
      - action: fiyat_form
      - active_loop: fiyat_form
