services:
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: voice-bot-whisper
    # network_mode: host REMOVED
    environment:
      - WHISPER_MODEL=small
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_BEAM_SIZE=1
    restart: unless-stopped
    ports:
      - "8000:8000"

  rasa:
    image: rasa/rasa:3.6.2
    container_name: voice-bot-rasa
    # network_mode: host REMOVED
    volumes:
      - ./rasa:/app
    command: run --enable-api --cors "*" --debug
    restart: unless-stopped
    ports:
      - "5005:5005"

  action-server:
    image: rasa/rasa-sdk:3.6.2
    container_name: voice-bot-action-server
    user: root
    volumes:
      - ./rasa/actions:/app/actions
    ports:
      - "5055:5055"
    entrypoint: ["sh", "-c", "pip install requests && python -m rasa_sdk --actions actions"]

  asterisk:
    build: .
    container_name: voice-bot-asterisk
    # network_mode: host REMOVED
    ports:
      - "5060:5060/udp"
      - "10000-10050:10000-10050/udp"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./asterisk_config:/etc/asterisk
      - ./app:/app
      - audio-data:/var/lib/asterisk/sounds/custom
    command: asterisk -fvvv
    restart: unless-stopped
    depends_on:
      - whisper
      - rasa

volumes:
  audio-data:
